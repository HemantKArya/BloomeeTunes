name: "Build & Release"

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.35.4'

jobs:
    # JOB 1: ANDROID
  build-android:
    name: Build Android
    runs-on: windows-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEY_STORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Max Cache Android
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\Pub\Cache
            .dart_tool/
            build/app/outputs/flutter-apk/
          key: ${{ runner.os }}-android-v3-${{ github.sha }}
          restore-keys: ${{ runner.os }}-android-v3-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract Version
        shell: powershell
        run: |
          $vLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          if (-not $vLine) { Write-Error 'version not found in pubspec.yaml'; exit 1 }
          $ver = $vLine.Matches[0].Groups[1].Value.Split('+')[0]
          echo "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Create Keystore
        if: env.HAS_KEYSTORE == 'true'
        shell: powershell
        run: |
          $b64 = "${{ secrets.KEY_STORE }}"
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("./android/bloomee.jks", $bytes)
          "keyPassword=${{ secrets.KEY_PASSWORD }}" | Out-File -FilePath ./android/key.properties -Encoding ascii
          "storePassword=${{ secrets.STORE_PASSWORD }}" | Out-File -FilePath ./android/key.properties -Append -Encoding ascii
          "keyAlias=${{ secrets.KEY_ALIAS }}" | Out-File -FilePath ./android/key.properties -Append -Encoding ascii

      - name: Build APK
        run: flutter build apk --release --split-per-abi --build-number ${{ github.run_number }}

      - name: Verify Sign
        shell: powershell
        run: |
          $buildToolsDir = Get-ChildItem "$env:ANDROID_HOME\build-tools" | Where-Object { $_.PSIsContainer } | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "Using build tools version: $($buildToolsDir.Name)"
          & "$($buildToolsDir.FullName)\apksigner.bat" verify build/app/outputs/flutter-apk/app-release.apk
          & "$($buildToolsDir.FullName)\apksigner.bat" verify build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          & "$($buildToolsDir.FullName)\apksigner.bat" verify build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          & "$($buildToolsDir.FullName)\apksigner.bat" verify build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Rename APKs
        shell: powershell
        run: |
          Rename-Item -Path "build/app/outputs/flutter-apk/app-release.apk" -NewName "bloomee_tunes_android_v$env:VERSION+${{ github.run_number }}_universal.apk"
          Rename-Item -Path "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" -NewName "bloomee_tunes_android_v$env:VERSION+${{ github.run_number }}_armeabi-v7a.apk"
          Rename-Item -Path "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" -NewName "bloomee_tunes_android_v$env:VERSION+${{ github.run_number }}_arm64-v8a.apk"
          Rename-Item -Path "build/app/outputs/flutter-apk/app-x86_64-release.apk" -NewName "bloomee_tunes_android_v$env:VERSION+${{ github.run_number }}_x86_64.apk"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-Android
          path: |
            build/app/outputs/flutter-apk/bloomee_tunes_android_v${{ env.VERSION }}+${{ github.run_number }}_universal.apk
            build/app/outputs/flutter-apk/bloomee_tunes_android_v${{ env.VERSION }}+${{ github.run_number }}_armeabi-v7a.apk
            build/app/outputs/flutter-apk/bloomee_tunes_android_v${{ env.VERSION }}+${{ github.run_number }}_arm64-v8a.apk
            build/app/outputs/flutter-apk/bloomee_tunes_android_v${{ env.VERSION }}+${{ github.run_number }}_x86_64.apk

      - name: Create Android Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            build/app/outputs/flutter-apk/bloomee_tunes_android_v${{ env.VERSION }}+${{ github.run_number }}_universal.apk
            build/app/outputs/flutter-apk/bloomee_tunes_android_v${{ env.VERSION }}+${{ github.run_number }}_armeabi-v7a.apk
            build/app/outputs/flutter-apk/bloomee_tunes_android_v${{ env.VERSION }}+${{ github.run_number }}_arm64-v8a.apk
            build/app/outputs/flutter-apk/bloomee_tunes_android_v${{ env.VERSION }}+${{ github.run_number }}_x86_64.apk
          tag: v${{ env.VERSION }}+${{ github.run_number }}
          token: ${{ secrets.SECRET_KEY || secrets.GITHUB_TOKEN }}
          prerelease: true
          allowUpdates: true

    # JOB 2: WINDOWS
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Max Cache Windows
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\Pub\Cache
            build/windows/x64/runner/Release/
          key: ${{ runner.os }}-windows-v3-${{ github.sha }}
          restore-keys: ${{ runner.os }}-windows-v3-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract Version
        shell: powershell
        run: |
          $vLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          if (-not $vLine) { Write-Error 'version not found in pubspec.yaml'; exit 1 }
          $ver = $vLine.Matches[0].Groups[1].Value.Split('+')[0]
          echo "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Build Windows App
        run: flutter build windows --release --build-number ${{ github.run_number }}

      - name: Rename Windows binary
        shell: powershell
        run: Rename-Item -Path "build/windows/x64/runner/Release/bloomee.exe" -NewName "Bloomee.exe"

      - name: ZIP build
        shell: powershell
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/x64/bloomee_tunes_windows_x64_v${{ env.VERSION }}+${{ github.run_number }}.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-Windows
          path: build/windows/x64/bloomee_tunes_windows_x64_v${{ env.VERSION }}+${{ github.run_number }}.zip

      - name: Create Windows Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: build/windows/x64/bloomee_tunes_windows_x64_v${{ env.VERSION }}+${{ github.run_number }}.zip
          tag: v${{ env.VERSION }}+${{ github.run_number }}
          token: ${{ secrets.SECRET_KEY || secrets.GITHUB_TOKEN }}
          prerelease: true
          allowUpdates: true

# JOB 3: MACOS
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Build macOS App
        run: flutter build macos --release --build-number ${{github.run_number}}

      - name: Sign App (Ad-Hoc)
        run: |
          codesign --deep --force --sign - "build/macos/Build/Products/Release/Bloomee.app"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG package
        run: |
          mkdir -p dist
          # Prepare a staging area with the .app and an Applications symlink for drag-and-drop install UX
          rm -rf /tmp/bloomee_dmg
          mkdir -p /tmp/bloomee_dmg
          ditto "build/macos/Build/Products/Release/Bloomee.app" "/tmp/bloomee_dmg/Bloomee.app"
          ln -s /Applications /tmp/bloomee_dmg/Applications
          
          # Create DMG using create-dmg with background image and icon positioning
          create-dmg \
            --volname "Bloomee" \
            --background "assets/icons/dmg-background@2x.jpg" \
            --window-size 788 312 \
            --icon-size 75 \
            --text-size 10 \
            --icon "Bloomee.app" 455 210 \
            --app-drop-link 686 210 \
            --hide-extension "Bloomee.app" \
            dist/bloomee_tunes_macos_v${{ env.VERSION }}+${{github.run_number}}.dmg \
            /tmp/bloomee_dmg
          
          # Cleanup
          rm -rf /tmp/bloomee_dmg
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-macOS
          path: dist/bloomee_tunes_macos_v${{ env.VERSION }}+${{github.run_number}}.dmg

      - name: Publish macOS to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/bloomee_tunes_macos_v${{ env.VERSION }}+${{github.run_number}}.dmg
          tag: v${{ env.VERSION }}+${{github.run_number}}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          allowUpdates: true 
          omitBodyDuringUpdate: true

  # JOB 4: LINUX
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Max Cache Linux
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build/linux/x64/release/bundle/
          key: ${{ runner.os }}-linux-v3-${{ github.sha }}
          restore-keys: ${{ runner.os }}-linux-v3-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build & Tar
        run: |
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          flutter build linux --release --build-number ${{ github.run_number }}
          tar -czf bloomee_linux_v$VER.tar.gz -C build/linux/x64/release/bundle .
          echo "VER=$VER" >> $GITHUB_ENV

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-Linux
          path: "*.tar.gz"

      - name: Release Linux
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.tar.gz"
          tag: v${{ env.VER }}+${{ github.run_number }}
          token: ${{ secrets.SECRET_KEY || secrets.GITHUB_TOKEN }}
          allowUpdates: true