name: "Build & Release"

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.35.4'

jobs:
  # JOB 1: ANDROID
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    # Map secrets here so they are accessible as env variables
    env:
      HAS_KEYSTORE: ${{ secrets.KEY_STORE != '' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Max Cache Android
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/
            build/app/outputs/flutter-apk/
          key: ${{ runner.os }}-android-v3-${{ github.sha }}
          restore-keys: ${{ runner.os }}-android-v3-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Extract Version
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Create Keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEY_STORE }}" | base64 --decode > android/bloomee.jks
          printf "keyPassword=${{ secrets.KEY_PASSWORD }}\nstorePassword=${{ secrets.STORE_PASSWORD }}\nkeyAlias=${{ secrets.KEY_ALIAS }}\nstoreFile=bloomee.jks" > android/key.properties

      - name: Build APK (Signed)
        if: env.HAS_KEYSTORE == 'true'
        run: flutter build apk --release --split-per-abi --build-number ${{ github.run_number }}

      - name: Build APK (Debug)
        if: env.HAS_KEYSTORE != 'true'
        run: flutter build apk --debug --split-per-abi --build-number ${{ github.run_number }}

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk/
          for file in *.apk; do
            mv "$file" "bloomee_v${{ env.VERSION }}+${{ github.run_number }}_${file/-release/}"
          done

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-Android
          path: build/app/outputs/flutter-apk/*.apk

      - name: Release Android
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/*.apk"
          tag: v${{ env.VERSION }}+${{ github.run_number }}
          token: ${{ secrets.SECRET_KEY || secrets.GITHUB_TOKEN }}
          allowUpdates: true

  # JOB 2: WINDOWS
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Max Cache Windows
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\Pub\Cache
            build/windows/x64/runner/Release/
          key: ${{ runner.os }}-win-v3-${{ github.sha }}
          restore-keys: ${{ runner.os }}-win-v3-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build & Zip
        shell: powershell
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value.Split('+')[0]
          flutter build windows --release --build-number ${{ github.run_number }}
          Rename-Item -Path "build/windows/x64/runner/Release/bloomee.exe" -NewName "Bloomee.exe"
          Compress-Archive -Path build/windows/x64/runner/Release/* -Destination "bloomee_windows_v$ver.zip"
          echo "VER=$ver" >> $env:GITHUB_ENV

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-Windows
          path: "*.zip"

      - name: Release Windows
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.zip"
          tag: v${{ env.VER }}+${{ github.run_number }}
          token: ${{ secrets.SECRET_KEY || secrets.GITHUB_TOKEN }}
          allowUpdates: true

  # JOB 3: MACOS
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Build macOS App
        run: flutter build macos --release --build-number ${{github.run_number}}

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG package
        run: |
          mkdir -p dist
          # Prepare a staging area with the .app and an Applications symlink for drag-and-drop install UX
          rm -rf /tmp/bloomee_dmg
          mkdir -p /tmp/bloomee_dmg
          ditto "build/macos/Build/Products/Release/Bloomee.app" "/tmp/bloomee_dmg/Bloomee.app"
          ln -s /Applications /tmp/bloomee_dmg/Applications
          
          # Create DMG using create-dmg with background image and icon positioning
          create-dmg \
            --volname "Bloomee" \
            --background "assets/icons/dmg-background@2x.jpg" \
            --window-size 788 312 \
            --icon-size 75 \
            --text-size 10 \
            --icon "Bloomee.app" 455 210 \
            --app-drop-link 686 210 \
            --hide-extension "Bloomee.app" \
            dist/bloomee_tunes_macos_v${{ env.VERSION }}+${{github.run_number}}.dmg \
            /tmp/bloomee_dmg
          
          # Cleanup
          rm -rf /tmp/bloomee_dmg
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-macOS
          path: dist/bloomee_tunes_macos_v${{ env.VERSION }}+${{github.run_number}}.dmg

      - name: Publish macOS to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/bloomee_tunes_macos_v${{ env.VERSION }}+${{github.run_number}}.dmg
          tag: v${{ env.VERSION }}+${{github.run_number}}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          allowUpdates: true 
          omitBodyDuringUpdate: true

  # JOB 4: LINUX
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Max Cache Linux
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build/linux/x64/release/bundle/
          key: ${{ runner.os }}-linux-v3-${{ github.sha }}
          restore-keys: ${{ runner.os }}-linux-v3-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build & Tar
        run: |
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          flutter build linux --release --build-number ${{ github.run_number }}
          tar -czf bloomee_linux_v$VER.tar.gz -C build/linux/x64/release/bundle .
          echo "VER=$VER" >> $GITHUB_ENV

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-Linux
          path: "*.tar.gz"

      - name: Release Linux
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.tar.gz"
          tag: v${{ env.VER }}+${{ github.run_number }}
          token: ${{ secrets.SECRET_KEY || secrets.GITHUB_TOKEN }}
          allowUpdates: true